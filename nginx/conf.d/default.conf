# ============================================================
# Бэкенд API: api.bloomai.ru
# ============================================================

server {
    listen 80;
    server_name api.bloomai.ru;

    # Для выпуска и продления сертификата Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Всё остальное на HTTP перенаправляем на HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name api.bloomai.ru;

    ssl_certificate     /etc/letsencrypt/live/api.bloomai.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.bloomai.ru/privkey.pem;

    # Фото грузятся до 20 МБ (проверка в api/plants/router.py).
    # Дефолтный лимит nginx 1 МБ обрезал бы загрузку фото.
    client_max_body_size 25M;

    # Встроенный DNS Docker. Без него nginx резолвит имя контейнера ОДИН раз
    # при старте и запоминает IP навсегда. После `docker compose up -d --build`
    # контейнер api пересоздаётся с новым IP, и nginx продолжает стучаться на
    # старый — сайт живёт (это статика), а API отдаёт 404/502 до ручного
    # перезапуска nginx. Резолвер + имя в переменной заставляют перечитывать
    # адрес на каждый запрос, и деплой больше не требует restart nginx.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_backend "api:8000";

    location / {
        proxy_pass http://$api_backend$request_uri;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Анализ фото через OpenAI бывает долгим, поднимаем таймаут.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}

# ============================================================
# Дашборд: dashboard.bloomai.ru
# (basic auth внутри самого приложения, nginx только проксирует)
# ============================================================

server {
    listen 80;
    server_name dashboard.bloomai.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name dashboard.bloomai.ru;

    # Один SAN-сертификат на оба домена хранится под именем первого домена.
    ssl_certificate     /etc/letsencrypt/live/api.bloomai.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.bloomai.ru/privkey.pem;

    # См. комментарий про резолвер в блоке api.bloomai.ru выше.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $dashboard_backend "dashboard:8000";

    location / {
        proxy_pass http://$dashboard_backend$request_uri;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ============================================================
# Сайт приложения: bloomai.ru и www.bloomai.ru
# Статика из папки ./site репозитория (примонтирована в compose)
# ============================================================

server {
    listen 80;
    server_name bloomai.ru www.bloomai.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://bloomai.ru$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name www.bloomai.ru;

    ssl_certificate     /etc/letsencrypt/live/api.bloomai.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.bloomai.ru/privkey.pem;

    # www сводим к основному домену, чтобы адрес был один
    return 301 https://bloomai.ru$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name bloomai.ru;

    ssl_certificate     /etc/letsencrypt/live/api.bloomai.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.bloomai.ru/privkey.pem;

    root  /usr/share/nginx/site;
    index index.html;

    # Сайт — обычная статика: HTML небольшой, ассеты лежат отдельными файлами
    # в /assets и кэшируются браузером. gzip сжимает текстовые ответы.
    gzip on;
    gzip_types text/html text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location / {
        try_files $uri $uri/ =404;
    }

    # В /assets имена файлов содержат хеш содержимого (img-688b1197fc.png),
    # поэтому обновление ассета всегда меняет имя — можно кэшировать навсегда.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Картинки и иконки в корне (favicon, og-image) — без хеша в имени.
    location ~* \.(png|ico|svg|jpg|jpeg|webp)$ {
        expires 7d;
        add_header Cache-Control "public";
    }
}
